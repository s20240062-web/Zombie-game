{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {ColladaLoader} from 'three/addons/loaders/ColladaLoader.js';
import {clone as skClone} from 'three/addons/utils/SkeletonUtils.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

/* ===== 設定 ===== */
const GUN_FILE='Gun.dae', ZOMBIE_FILE='zombie_character_animated.glb';
const GUN_LEN=0.5, GUN_YAW=Math.PI, GUN_POS=[0.2,-0.2,-0.45], AIM_POS=[0,-0.15,-0.4];
const ZOMBIE_H=1.8, ZOMBIE_YAW=-Math.PI/2;   // ゾンビの向き。ずれたら Math.PI/2 や 0 に
const ATK_HIT=0.4, ATK_END=1.1, MAG=12, SPEED=3.4;
const ALIVE_MAX=16;      // 同時に動くゾンビの上限（重い場合は減らす）
const CAPR=1.2;          // 当たり判定の太さ倍率

/* ===== 病院マップ（#壁 S開始 Zゾンビ A弾 H救急箱 K鍵 X出口） =====
   スタートは出口の近く、キーカードは西の端の病棟。取ったあと出口まで走り抜ける構成 */
const MAP=[
"#####################",
"#...#.....#.....#...#",
"#.A.#.....#..Z..#.Z.#",
"#..Z#.A...#.....#...#",
"#..K#..H..#.....#...#",
"##.####.#####.###.###",
"#........Z.....Z.S..X",
"###.###.#####.###.###",
"#...#.....#.....#...#",
"#...#..Z..#..A..#.H.#",
"#.Z.#.....#.....#..Z#",
"#...#..A..#.....#...#",
"#####################"];
const CS=4, WH=3.2, MW=21, MH=13;
let doorOpen=false;
const wallAt=(i,j)=>{if(i<0||j<0||i>=MW||j>=MH)return true;const c=MAP[j][i];return c==='#'||(c==='X'&&!doorOpen);};
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);

/* ===== シーン ===== */
const renderer=new THREE.WebGLRenderer({antialias:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5)); renderer.setSize(innerWidth,innerHeight);
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x05070b); scene.fog=new THREE.Fog(0x05070b,6,34);
const cam=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.05,80); cam.rotation.order='YXZ'; scene.add(cam);
const amb=new THREE.AmbientLight(0x8890b8,1.45); scene.add(amb);
const torch=new THREE.SpotLight(0xfff0d0,170,40,0.6,0.6,1.5); cam.add(torch); cam.add(torch.target); torch.target.position.set(0,0,-1);
const flash=new THREE.PointLight(0xffaa44,0,8); flash.position.set(0.2,-0.1,-0.9); cam.add(flash);
const ANISO=Math.min(4,renderer.capabilities.getMaxAnisotropy());

/* ===== テクスチャ ===== */
function mkTex(w,h,draw,rx,ry,an){
  const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx,ry);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=an||1;return t;
}
function stains(g,w,h,n,rgb,amax){
  for(let i=0;i<n;i++){const x=Math.random()*w,y=Math.random()*h,r=8+Math.random()*28,q=g.createRadialGradient(x,y,0,x,y,r);
    q.addColorStop(0,`rgba(${rgb},${amax*(.4+Math.random()*.6)})`);q.addColorStop(1,`rgba(${rgb},0)`);g.fillStyle=q;g.fillRect(x-r,y-r,r*2,r*2);}
}
const floorTex=mkTex(256,256,(g,w,h)=>{
  const ts=w/2;for(let a=0;a<2;a++)for(let b=0;b<2;b++){const v=rnd(-9,9);g.fillStyle=`rgb(${104+v|0},${112+v|0},${103+v|0})`;g.fillRect(a*ts,b*ts,ts,ts);}
  for(let i=0;i<1100;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.08})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3);}
  for(let i=0;i<12;i++){g.strokeStyle=`rgba(15,15,15,${.05+Math.random()*.12})`;g.beginPath();const x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);g.lineTo(x+rnd(-45,45),y+rnd(-45,45));g.stroke();}
  stains(g,w,h,5,'70,55,30',.35);stains(g,w,h,2,'80,10,10',.3);
  g.strokeStyle='#262a27';g.lineWidth=3;g.strokeRect(0,0,w,h);g.beginPath();g.moveTo(ts,0);g.lineTo(ts,h);g.moveTo(0,ts);g.lineTo(w,ts);g.stroke();
},MW*2,MH*2,ANISO);
const ceilTex=mkTex(256,256,(g,w,h)=>{
  g.fillStyle='#8e9189';g.fillRect(0,0,w,h);
  for(let i=0;i<900;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.07})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*2,1+Math.random()*2);}
  stains(g,w,h,6,'90,70,35',.4);
  g.strokeStyle='#4a4d4f';g.lineWidth=4;g.strokeRect(0,0,w,h);g.beginPath();g.moveTo(w/2,0);g.lineTo(w/2,h);g.moveTo(0,h/2);g.lineTo(w,h/2);g.stroke();
},MW*2,MH*2,ANISO);
const wallTex=mkTex(256,256,(g,w,h)=>{
  const sp=h*0.5;
  g.fillStyle='#a8aca0';g.fillRect(0,0,w,sp);
  g.fillStyle='#38544d';g.fillRect(0,sp,w,h-sp);
  g.strokeStyle='rgba(0,0,0,.4)';g.lineWidth=2;
  for(let x=0;x<=w;x+=w/8){g.beginPath();g.moveTo(x,sp);g.lineTo(x,h);g.stroke();}
  for(let y=sp;y<=h;y+=(h-sp)/5){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}
  g.fillStyle='#6f7b72';g.fillRect(0,sp-5,w,9);g.fillStyle='rgba(0,0,0,.45)';g.fillRect(0,sp+4,w,3);
  g.fillStyle='#1c1f1d';g.fillRect(0,h-9,w,9);
  for(let i=0;i<1400;i++){g.fillStyle=`rgba(0,0,0,${Math.random()*.08})`;g.fillRect(Math.random()*w,Math.random()*h,1+Math.random()*3,1+Math.random()*3);}
  for(let i=0;i<8;i++){const x=Math.random()*w,l=30+Math.random()*120,q=g.createLinearGradient(0,0,0,l);q.addColorStop(0,'rgba(70,55,30,.4)');q.addColorStop(1,'rgba(70,55,30,0)');g.fillStyle=q;g.fillRect(x,0,3+Math.random()*7,l);}
  stains(g,w,h,3,'80,10,10',.3);
  g.strokeStyle='rgba(30,30,30,.35)';g.lineWidth=1;for(let i=0;i<3;i++){g.beginPath();let x=Math.random()*w,y=0;g.moveTo(x,y);for(let k=0;k<7;k++){x+=rnd(-9,9);y+=rnd(5,18);g.lineTo(x,y);}g.stroke();}
},1,1,ANISO);
function bloodTex(){return mkTex(128,128,(g,w,h)=>{
  g.clearRect(0,0,w,h);const cx=w/2,cy=h*.4;
  for(let i=0;i<26;i++){const a=Math.random()*6.283,d=Math.random()*w*.28,r=3+Math.random()*13;g.fillStyle=`rgba(${70+Math.random()*50|0},4,4,${.55+Math.random()*.4})`;g.beginPath();g.arc(cx+Math.cos(a)*d,cy+Math.sin(a)*d*.8,r,0,7);g.fill();}
  for(let i=0;i<7;i++){const x=cx+rnd(-34,34),y=cy+rnd(-8,14),l=rnd(18,h-y-4);g.fillStyle='rgba(90,4,4,.8)';g.fillRect(x,y,rnd(2,4.5),l);g.beginPath();g.arc(x+1.5,y+l,3,0,7);g.fill();}
},1,1,1);}
const bloodTexes=[bloodTex(),bloodTex(),bloodTex()];

/* ===== ワールド ===== */
const world=[], cols=[];      // cols: 家具の当たり(AABB)
const floor=new THREE.Mesh(new THREE.PlaneGeometry(MW*CS,MH*CS),new THREE.MeshLambertMaterial({map:floorTex}));
floor.rotation.x=-Math.PI/2; floor.position.set(MW*CS/2,0,MH*CS/2);
const ceil=new THREE.Mesh(new THREE.PlaneGeometry(MW*CS,MH*CS),new THREE.MeshLambertMaterial({map:ceilTex}));
ceil.rotation.x=Math.PI/2; ceil.position.set(MW*CS/2,WH,MH*CS/2);
let wc=0; for(const r of MAP)for(const ch of r)if(ch==='#')wc++;
const walls=new THREE.InstancedMesh(new THREE.BoxGeometry(CS,WH,CS),new THREE.MeshLambertMaterial({map:wallTex}),wc);
{let k=0;const m4=new THREE.Matrix4(),cc=new THREE.Color();MAP.forEach((r,j)=>[...r].forEach((ch,i)=>{if(ch==='#'){m4.makeTranslation(i*CS+CS/2,WH/2,j*CS+CS/2);walls.setMatrixAt(k,m4);const v=.72+Math.random()*.28;cc.setRGB(v,v,v);walls.setColorAt(k,cc);k++;}}));walls.instanceColor.needsUpdate=true;}
const door=new THREE.Mesh(new THREE.BoxGeometry(CS,WH,CS),new THREE.MeshLambertMaterial({color:0x7a2a2a}));
const DX=20*CS+CS/2, DZ=6*CS+CS/2; door.position.set(DX,WH/2,DZ);
const exitL=new THREE.PointLight(0x44ff88,10,16); exitL.position.set(DX-5,2.5,DZ);
scene.add(floor,ceil,walls,door,exitL); world.push(floor,ceil,walls,door);
function resolve(p,r){
  const ci=Math.floor(p.x/CS),cj=Math.floor(p.z/CS);
  for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){
    if(!wallAt(i,j))continue; const x0=i*CS,z0=j*CS,cx=clamp(p.x,x0,x0+CS),cz=clamp(p.z,z0,z0+CS);
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2>1e-6){const d=Math.sqrt(d2);p.x+=dx/d*(r-d);p.z+=dz/d*(r-d);}else p.x+=(p.x<x0+CS/2?-1:1)*r;}
  }
  for(const c of cols){   // 家具
    if(p.x<c.x0-r||p.x>c.x1+r||p.z<c.z0-r||p.z>c.z1+r)continue;
    const cx=clamp(p.x,c.x0,c.x1),cz=clamp(p.z,c.z0,c.z1),dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2>1e-8){if(d2<r*r){const d=Math.sqrt(d2);p.x+=dx/d*(r-d);p.z+=dz/d*(r-d);}}
    else{const l=p.x-c.x0,rr=c.x1-p.x,t=p.z-c.z0,b=c.z1-p.z,m=Math.min(l,rr,t,b);
      if(m===l)p.x=c.x0-r;else if(m===rr)p.x=c.x1+r;else if(m===t)p.z=c.z0-r;else p.z=c.z1+r;}
  }
}
function lineClear(x0,z0,x1,z1){
  const d=Math.hypot(x1-x0,z1-z0),n=Math.ceil(d/0.6);
  for(let i=1;i<n;i++){const t=i/n;if(wallAt(Math.floor((x0+(x1-x0)*t)/CS),Math.floor((z0+(z1-z0)*t)/CS)))return false;}
  return true;
}
// 経路探索（プレイヤー位置からのBFS）
const D4=[[1,0],[-1,0],[0,1],[0,-1]], dist=new Int16Array(MW*MH); let fCell=-1;
function flow(){
  const pc=Math.floor(p.z/CS)*MW+Math.floor(p.x/CS); if(pc===fCell)return; fCell=pc; dist.fill(999); dist[pc]=0;
  const q=[pc]; for(let h=0;h<q.length;h++){const c=q[h],ci=c%MW,cj=(c/MW)|0;
    for(const [a,b] of D4){if(wallAt(ci+a,cj+b))continue;const n=(cj+b)*MW+ci+a;if(dist[n]===999){dist[n]=dist[c]+1;q.push(n);}}}
}
function nextCell(x,z){
  const ci=Math.floor(x/CS),cj=Math.floor(z/CS); let bd=dist[cj*MW+ci],bx=null;
  for(const [a,b] of D4){if(wallAt(ci+a,cj+b))continue;const d=dist[(cj+b)*MW+ci+a];if(d<bd){bd=d;bx=[(ci+a+.5)*CS,(cj+b+.5)*CS];}}
  return bx;
}

/* ===== 音 ===== */
let ac;
function audio(){
  if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain();o.type='sawtooth';o.frequency.value=48;g.gain.value=0.025;o.connect(g);g.connect(ac.destination);o.start();}
  if(ac.state!=='running')ac.resume();
}
function noise(dur,vol,fq){
  if(!ac)return; const n=ac.sampleRate*dur|0,b=ac.createBuffer(1,n,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2);
  const s=ac.createBufferSource();s.buffer=b;const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=fq;
  const g=ac.createGain();g.gain.value=vol;s.connect(f);f.connect(g);g.connect(ac.destination);s.start();
}
function tone(type,f0,f1,dur,vol){
  if(!ac)return;const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur);
}
const sfx={
  shot(){noise(.35,.9,3500);tone('square',180,40,.2,.35);},
  groan(){tone('sawtooth',80+Math.random()*40,45,.9,.12);},
  scream(){tone('sawtooth',360+Math.random()*120,110,.8,.07);},
  hurt(){tone('sawtooth',220,70,.3,.4);},
  reload(){tone('square',900,500,.05,.15);setTimeout(()=>tone('square',500,900,.05,.15),900);},
  hit(){noise(.12,.5,900);tone('triangle',200,60,.12,.35);},
  step(){noise(.07,.22,500);},
  click(){tone('square',1200,900,.03,.2);},
  pick(){tone('sine',600,1200,.15,.25);},
  heart(){tone('sine',65,40,.14,.6);setTimeout(()=>tone('sine',60,38,.14,.5),170);},
  creak(){tone('sawtooth',90,160,1.2,.1);},
  siren(){tone('sawtooth',560,900,.85,.06);},
  slam(){noise(.6,.9,400);tone('square',70,25,.7,.5);},
  blackout(){noise(.3,.45,300);tone('sawtooth',300,60,.4,.12);}
};

/* ===== 状態 ===== */
const p={x:0,z:0,hp:100,yaw:0,pitch:0}, vel={x:0,z:0};
let playing=false,loaded=false,editing=false,ammo=MAG,reserve=24,cd=0,reloading=false,rt=0,recoil=0,flashT=0,dmgA=0,bob=0,moveAmt=0;
let aiming=false,aimK=0,kick=0,shake=0,hasKey=false,kills=0,tTime=0,hbT=0,msgT=0,creakT=8,lyaw=0,lpitch=0,swX=0,swY=0,hudT=0,pruneT=0;
const alarm={on:false,t:0,spawnT:0,blackT:0,off:0,sirenT:0};
const zombies=[],pickups=[];
let gun,zProto,zClips;
function hud(){
  $('hp').style.width=Math.max(0,p.hp)+'%';
  $('ammo').textContent=reloading?'RELOADING...':`AMMO ${ammo} / ${reserve}`;
  let t=hasKey?'🔑 キーカード所持<br>目標：出口(赤い扉)へ':'目標：キーカードを探せ<br><small style="opacity:.8">（西の端の病棟のどこか）</small>';
  if(alarm.on)t='<span style="color:#ff5a4a">🚨 警報作動中！出口へ走れ！</span><br>出口まで '+Math.max(0,Math.round(Math.hypot(DX-p.x,DZ-p.z)))+'m';
  $('info').innerHTML=t+`<br>撃破 ${kills}`;
}
function banner(t){const b=$('banner');b.textContent=t;b.style.opacity=1;clearTimeout(banner.t);banner.t=setTimeout(()=>b.style.opacity=0,2400);}

/* ===== 血・弾痕 ===== */
const bloodM=[0xaa0000,0x550000,0x8a2a2a,0xcc1111].map(c=>new THREE.MeshBasicMaterial({color:c}));
const dustM=new THREE.MeshBasicMaterial({color:0x999488});
const bGeo=new THREE.BoxGeometry(1,1,1),decalG=new THREE.CircleGeometry(1,10);
const parts=[],decals=[],holes=[];
function burst(x,y,z,n,spd,big,bx=0,bz=0,dust=false){
  for(let i=0;i<n;i++){
    const m=new THREE.Mesh(bGeo,dust?dustM:bloodM[Math.random()*4|0]);
    const s=dust?0.02+Math.random()*0.03:(big&&Math.random()<0.25?0.1+Math.random()*0.12:0.03+Math.random()*0.05);
    m.scale.set(s,s,s);m.position.set(x,y,z);
    const a=Math.random()*6.283,u=Math.random()*spd;
    scene.add(m);parts.push({m,s,dust,vx:Math.cos(a)*u+bx,vy:Math.random()*spd*1.1,vz:Math.sin(a)*u+bz,rest:false,life:8});
    if(parts.length>280){scene.remove(parts.shift().m);}
  }
}
function splat(x,z,r,perm){
  const m=new THREE.Mesh(decalG,new THREE.MeshBasicMaterial({color:Math.random()<.5?0x7a0000:0x3a0000,transparent:true,opacity:.85,depthWrite:false}));
  m.rotation.x=-Math.PI/2;m.position.set(x,0.012+Math.random()*0.004,z);m.scale.setScalar(r);scene.add(m);
  if(!perm){decals.push(m);if(decals.length>90){const o=decals.shift();scene.remove(o);o.material.dispose();}}
  return m;
}
// 壁・床などの弾痕（ドアに当たった場合はドアに付いて一緒に動く）
const holeMat=new THREE.MeshBasicMaterial({color:0x151515,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-2});
function hole(pt,n,obj){
  const m=new THREE.Mesh(decalG,holeMat);
  m.scale.setScalar(0.045);m.position.set(pt.x+n.x*0.012,pt.y+n.y*0.012,pt.z+n.z*0.012);m.lookAt(pt.x+n.x,pt.y+n.y,pt.z+n.z);

const wm1=new THREE.MeshBasicMaterial({color:0x8a0000,transparent:true,opacity:.95,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-3});
const wm2=new THREE.MeshBasicMaterial({color:0x1a0000,transparent:true,opacity:.95,depthWrite:false,polygonOffset:true,polygonOffsetFactor:-4});
function wound(z,pt,n,bone){
  if((z.wounds=(z.wounds||0)+1)>14)return;
  for(const [mat,sc] of [[wm1,0.065],[wm2,0.03]]){
    const m=new THREE.Mesh(decalG,mat);m.scale.setScalar(sc*(0.8+Math.random()*0.5));
    m.position.set(pt.x+n.x*0.014,pt.y+n.y*0.014,pt.z+n.z*0.014);m.lookAt(pt.x+n.x,pt.y+n.y,pt.z+n.z);
    scene.add(m);bone.attach(m);
  }
}
function updateParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const q=parts[i],m=q.m;
    if(!q.rest){
      q.vy-=14*dt;m.position.x+=q.vx*dt;m.position.y+=q.vy*dt;m.position.z+=q.vz*dt;
      if(m.position.y<=0.03){
        m.position.y=0.03;
        if(q.dust){scene.remove(m);parts.splice(i,1);continue;}
        splat(m.position.x,m.position.z,q.s*4+0.08+Math.random()*0.1);
        if(q.s>0.09){q.rest=true;m.scale.y=q.s*0.6;}else{scene.remove(m);parts.splice(i,1);}
      }
    }else{q.life-=dt;if(q.life<0){scene.remove(m);parts.splice(i,1);}}
  }
}

function signMesh(text,w,h,bg,fg,x,y,z,ry,glow){
  const t=mkTex(256,Math.round(256*h/w),(g,cw,ch)=>{g.fillStyle=bg;g.fillRect(0,0,cw,ch);g.strokeStyle=fg;g.lineWidth=4;g.strokeRect(5,5,cw-10,ch-10);

    for(let i=0;i<5;i++){g.fillStyle='rgba(0,0,0,.25)';g.fillRect(Math.random()*cw,Math.random()*ch,rnd(10,40),rnd(1,3));}},1,1,2);
  const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),glow?new THREE.MeshBasicMaterial({map:t}):new THREE.MeshLambertMaterial({map:t,emissive:0x303030,emissiveMap:t}));
  m.position.set(x,y,z);m.rotation.y=ry;return m;
}

      if(z.t>=ATK_END){z.state='walk';play(z,'walk');}
    }else if(z.state==='hit'){
      z.t+=dt;h=Math.atan2(dx,dz);if(z.t>0.6){z.state='walk';play(z,'walk');}
    }
    let dd=h-z.yaw;dd=Math.atan2(Math.sin(dd),Math.cos(dd));z.yaw+=dd*Math.min(1,dt*8);
    z.w.rotation.y=z.yaw+ZOMBIE_YAW;
    for(let j=i+1;j<zombies.length;j++){
      const o=zombies[j];if(o.state==='dead')continue;
      const ox=pos.x-o.w.position.x,oz=pos.z-o.w.position.z,od=Math.hypot(ox,oz);
      if(od<0.8&&od>1e-4){const k=(0.8-od)/2/od;pos.x+=ox*k;pos.z+=oz*k;o.w.position.x-=ox*k;o.w.position.z-=oz*k;}
    }
    resolve(pos,0.4);
  }
}

/* ===== 射撃 ===== */
const dir=new THREE.Vector3(),rc=new THREE.Raycaster();
function raySphere(o,d,cx,cy,cz,r){
  const lx=cx-o.x,ly=cy-o.y,lz=cz-o.z,t=lx*d.x+ly*d.y+lz*d.z;if(t<0)return -1;
  const h=lx*lx+ly*ly+lz*lz-t*t;if(h>r*r)return -1;return Math.max(0,t-Math.sqrt(r*r-h));
}
// 実際の骨の位置（アニメーション後）から作ったカプセルと弾道の当たり判定。当たった骨・部位・位置・面の向きを返す
const vA=new THREE.Vector3(),vB=new THREE.Vector3(),vE=new THREE.Vector3();
function capHit(o,d,z,maxT){
  const q=z.w.position;if(raySphere(o,d,q.x,1.0,q.z,1.6)<0)return null;
  let best=null;
  for(const c of z.caps){
    c.a.getWorldPosition(vA);c.b.getWorldPosition(vB);
    if(c.ext){vE.copy(vA).sub(vB).normalize().multiplyScalar(c.ext);vB.copy(vA).add(vE);}
    else if(c.rev){vB.copy(vA).multiplyScalar(2).sub(vB);}
    vE.copy(vB).sub(vA);
    const cc=vE.lengthSq(),w0x=o.x-vA.x,w0y=o.y-vA.y,w0z=o.z-vA.z,b=d.dot(vE),dd=d.x*w0x+d.y*w0y+d.z*w0z,ee=vE.x*w0x+vE.y*w0y+vE.z*w0z;
    let s=0,t;const den=cc-b*b;
    if(cc<1e-8)s=0;else if(den>1e-8)s=clamp((ee-b*dd)/den,0,1);else s=clamp(ee/cc,0,1);
    t=b*s-dd;if(t<0){t=0;s=cc<1e-8?0:clamp(ee/cc,0,1);}
    const px=o.x+d.x*t,py=o.y+d.y*t,pz=o.z+d.z*t,sx=vA.x+vE.x*s,sy=vA.y+vE.y*s,sz=vA.z+vE.z*s;
    const dist2=(px-sx)**2+(py-sy)**2+(pz-sz)**2;
    if(dist2>c.r*c.r)continue;
    const th=Math.max(0,t-Math.sqrt(c.r*c.r-dist2));
    if(th>maxT||(best&&th>=best.t))continue;
    const pt=new THREE.Vector3(o.x+d.x*th,o.y+d.y*th,o.z+d.z*th);
    const n=new THREE.Vector3(pt.x-sx,pt.y-sy,pt.z-sz);if(n.lengthSq()<1e-8)n.copy(d).negate();n.normalize();
    best={t:th,c,pt,n,A:vA.clone(),B:vB.clone()};
  }
  return best;
}
function fire(){
  if(!playing||editing||reloading||cd>0)return;
  if(ammo<=0){sfx.click();if(reserve>0)reload();else banner('弾がない！');return;}
  ammo--;cd=0.3;recoil=1;kick+=0.04+Math.random()*0.02;flashT=0.05;sfx.shot();alertZ(p.x,p.z,35);
  cam.getWorldDirection(dir);
  const sp=(aimK>0.5?0.003:0.022)+moveAmt*0.02;
  dir.x+=(Math.random()-.5)*sp*2;dir.y+=(Math.random()-.5)*sp*2;dir.z+=(Math.random()-.5)*sp*2;dir.normalize();
  const o=cam.position;rc.set(o,dir);rc.far=60;
  const wh=rc.intersectObjects(world,false)[0],wd=wh?wh.distance:60;
  let bz=null,bt=wd,bh=null;
  for(const z of zombies){if(z.state==='dead')continue;const r=capHit(o,dir,z,bt);if(r&&r.t<bt){bt=r.t;bz=z;bh=r;}}
  if(bz){
    const pt=bh.pt,n=bh.n,c=bh.c,head=c.zone==='head';
    burst(pt.x,pt.y,pt.z,head?35:22,3.5,false,-dir.x*1.5,-dir.z*1.5);          // 入口の飛沫
    burst(pt.x+dir.x*0.6,pt.y,pt.z+dir.z*0.6,head?25:16,3,true,dir.x*3.5,dir.z*3.5); // 射出口の飛沫
    if(Math.random()<.4)splat(bz.w.position.x+dir.x*(1+Math.random()),bz.w.position.z+dir.z*(1+Math.random()),0.25+Math.random()*0.2);
    wound(bz,pt,n,c.a);sfx.hit();
    bz.hp-=c.dmg;bz.mode='chase';
    if(bz.hp<=0)killZ(bz,bh,dir);
    else{react(bz,bh,dir,false);if(c.zone==='head'||c.zone==='torso'){bz.state='hit';bz.t=0;play(bz,'hit',true);}}
  }else if(wh){
    const n=wh.face.normal.clone().transformDirection(wh.object.matrixWorld);
    hole(wh.point,n,wh.object);burst(wh.point.x+n.x*0.03,wh.point.y+n.y*0.03,wh.point.z+n.z*0.03,8,1.5,false,n.x,n.z,true);
  }
  hud();
}

const BIDS=['fire','aim','reload'], LKEY='zfps_layout_v1';

  fire:{x:1-(6+11)*v/W,y:1-(8+11)*v/H,s:22},aim:{x:1-(10+7.5)*v/W,y:1-(33+7.5)*v/H,s:15},reload:{x:1-(31+7)*v/W,y:1-(6+7)*v/H,s:14}};}

/* ===== タッチ操作 ===== */
const joy={id:null,ox:0,oy:0,x:0,y:0},look={id:null,x:0,y:0},aimT={id:null,x:0,y:0};
const jb=$('jb'),jk=$('jk');
const sens=()=>0.005*(aimK>0.5?0.5:1);
function turn(dx,dy){p.yaw-=dx*sens();p.pitch=clamp(p.pitch-dy*sens(),-1.2,1.2);}
// ボタンの反応範囲：見えている円の内側だけ。AIMは少し内側（縁をかすめた指は視点操作として扱う）
const HITF={fire:.95,reload:.95,aim:.85};
function hitBtn(x,y){
  for(const id of BIDS){const r=$(id).getBoundingClientRect();
    if(Math.hypot(x-(r.left+r.width/2),y-(r.top+r.height/2))<r.width/2*HITF[id])return id;}
  return null;
}
let lookEnd={t:0,x:0,y:0};
const onUI=t=>t.target&&t.target.closest&&t.target.closest('#gear,#editbar');
document.addEventListener('touchstart',e=>{
  if(editing)return;
  for(const t of e.changedTouches){
    if(onUI(t))continue;
    let b=hitBtn(t.clientX,t.clientY);
    // 視点を動かしていた指を離してすぐ近くをタッチした場合は、AIMではなく視点操作の続きとして扱う
    if(b==='aim'&&performance.now()-lookEnd.t<260&&Math.hypot(t.clientX-lookEnd.x,t.clientY-lookEnd.y)<innerHeight*.3)b=null;
    if(b){
      if(b==='fire')fire();else if(b==='reload')reload();
      else if(aimT.id===null){aimT.id=t.identifier;aimT.x=t.clientX;aimT.y=t.clientY;aiming=true;}
      continue;
    }
    if(t.clientX<innerWidth/2){
      if(joy.id===null){joy.id=t.identifier;joy.ox=t.clientX;joy.oy=t.clientY;joy.x=joy.y=0;
        for(const el of [jb,jk]){el.style.display='block';el.style.left=t.clientX+'px';el.style.top=t.clientY+'px';}}
    }else if(look.id===null){look.id=t.identifier;look.x=t.clientX;look.y=t.clientY;}
  }
},{passive:false});
document.addEventListener('touchmove',e=>{
  e.preventDefault();if(editing)return;
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){
      let dx=(t.clientX-joy.ox)/50,dy=(t.clientY-joy.oy)/50;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
      joy.x=dx;joy.y=dy;jk.style.left=joy.ox+dx*50+'px';jk.style.top=joy.oy+dy*50+'px';
    }else if(t.identifier===look.id){turn(t.clientX-look.x,t.clientY-look.y);look.x=t.clientX;look.y=t.clientY;}
    else if(t.identifier===aimT.id){turn(t.clientX-aimT.x,t.clientY-aimT.y);aimT.x=t.clientX;aimT.y=t.clientY;}
  }
},{passive:false});
function tEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===joy.id){joy.id=null;joy.x=joy.y=0;jb.style.display=jk.style.display='none';}
    if(t.identifier===look.id){look.id=null;lookEnd={t:performance.now(),x:t.clientX,y:t.clientY};}
    if(t.identifier===aimT.id){aimT.id=null;aiming=false;}
  }
}
document.addEventListener('touchend',tEnd);document.addEventListener('touchcancel',tEnd);

/* ===== メインループ ===== */
let tPrev=performance.now(),clockT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-tPrev)/1000,0.05);tPrev=now;clockT+=dt;
  let pulse=0,blk=1;
  if(playing&&!editing){
    tTime+=dt;
    // 慣性つき移動
    const spd=SPEED*(aimK>0.5?0.55:1),s=Math.sin(p.yaw),c=Math.cos(p.yaw);
    const tx=(c*joy.x+s*joy.y)*spd,tz=(-s*joy.x+c*joy.y)*spd,k=1-Math.exp(-(Math.hypot(joy.x,joy.y)>0.05?9:4)*dt);
    vel.x+=(tx-vel.x)*k;vel.z+=(tz-vel.z)*k;
    p.x+=vel.x*dt;p.z+=vel.z*dt;resolve(p,0.4);
    const sv=Math.hypot(vel.x,vel.z);moveAmt=sv/SPEED;
    const pb=bob;bob+=sv*dt*1.9;if(Math.floor(bob/Math.PI)!==Math.floor(pb/Math.PI)&&sv>0.8)sfx.step();
    // 武器・照準
    cd-=dt;aimK+=((aiming?1:0)-aimK)*Math.min(1,dt*10);
    if(reloading){rt-=dt;if(rt<=0){reloading=false;const n=Math.min(MAG-ammo,reserve);ammo+=n;reserve-=n;hud();}}
    recoil=Math.max(0,recoil-dt*8);kick*=Math.exp(-dt*9);shake*=Math.exp(-dt*5);
    if(flashT>0){flashT-=dt;flash.intensity=flashT>0?25:0;}
    // 警報（キーカード入手後）
    if(alarm.on){
      alarm.t+=dt;pulse=.5+.5*Math.sin(clockT*7);
      alarm.sirenT-=dt;if(alarm.sirenT<0){alarm.sirenT=0.9;sfx.siren();}
      alarm.spawnT-=dt;if(alarm.spawnT<0){alarm.spawnT=clamp(4.5-alarm.t*0.05,2,4.5);const n=alarm.t>30?2:1;for(let q=0;q<n;q++)spawnFar();}
      alarm.blackT-=dt;if(alarm.blackT<0){alarm.blackT=4+Math.random()*6;alarm.off=.5;sfx.blackout();shake=Math.max(shake,.6);}
      alarm.off=Math.max(0,alarm.off-dt);
      blk=alarm.off>0?(Math.random()<.7?.04:.5):1;
      amb.color.setHex(0xa05555);amb.intensity=(1.0+.45*pulse)*(alarm.off>0?.3:1);
      $('alarm').style.opacity=.3+.4*pulse;
      exitL.intensity=10+14*pulse;
      hudT-=dt;if(hudT<0){hudT=.3;hud();}
    }
    pruneT-=dt;if(pruneT<0){pruneT=3;pruneDead();}
    // 見た目：ボブ・呼吸・揺れ
    const am=1-aimK*0.7,bx=Math.cos(bob)*0.035*moveAmt*am,by=Math.abs(Math.sin(bob))*0.06*moveAmt*am+Math.sin(clockT*1.4)*0.005;
    cam.position.set(p.x+c*bx+(Math.random()-.5)*shake*0.06,1.6-by+(Math.random()-.5)*shake*0.06,p.z-s*bx);
    cam.rotation.set(p.pitch+kick+Math.sin(clockT*1.1)*0.002+(Math.random()-.5)*shake*0.03,p.yaw+(Math.random()-.5)*kick*0.1,Math.cos(bob)*0.012*moveAmt+joy.x*-0.01+(Math.random()-.5)*shake*0.05);
    cam.fov=70-aimK*24;cam.updateProjectionMatrix();$('cross').style.opacity=1-aimK;
    // 銃のスウェイ：視点を動かした向きと逆に「ほんの少し」だけずれて、すぐ戻る
    const vyaw=(lyaw-p.yaw)/Math.max(dt,0.001),vpit=(lpitch-p.pitch)/Math.max(dt,0.001),sc=1-aimK*0.7;
    swX+=(clamp(vyaw*0.006,-0.03,0.03)*sc-swX)*Math.min(1,dt*10);
    swY+=(clamp(vpit*0.005,-0.02,0.02)*sc-swY)*Math.min(1,dt*10);
    lyaw=p.yaw;lpitch=p.pitch;
    if(gun){
      const rp=reloading?Math.sin(Math.PI*(1-rt/1.8)):0;
      gun.position.set(GUN_POS[0]+(AIM_POS[0]-GUN_POS[0])*aimK+bx*0.6-swX,
        GUN_POS[1]+(AIM_POS[1]-GUN_POS[1])*aimK-rp*0.18-by*0.5+swY,
        GUN_POS[2]+(AIM_POS[2]-GUN_POS[2])*aimK+recoil*0.07);
      gun.rotation.set(recoil*0.18-rp*0.7,0,0);
    }
    // 照明のちらつき
    const fl=Math.random()<0.02?0.3:1;torch.intensity=(170+Math.random()*25)*fl;if(!alarm.on)amb.intensity=1.45*(fl<1?0.6:1);
    torch.target.position.set(-swX*8,swY*8,-1);
    updateLights(dt,pulse,blk);updateDust(dt);
    // ゾンビ・アイテム
    updateZombies(dt);updateParts(dt);
    for(let i=pickups.length-1;i>=0;i--){
      const q=pickups[i];q.m.rotation.y+=dt*1.5;q.m.position.y=0.6+Math.sin(clockT*2+i)*0.08;
      if(Math.hypot(p.x-q.x,p.z-q.z)<1.2){
        if(q.t==='A'){reserve+=12;banner('弾薬 +12');}
        else if(q.t==='H'){if(p.hp>=100)continue;p.hp=Math.min(100,p.hp+40);banner('体力回復');}
        else{hasKey=true;startAlarm();}
        sfx.pick();scene.remove(q.m);pickups.splice(i,1);hud();
      }
    }
    // 出口
    const dd=Math.hypot(p.x-DX,p.z-DZ);msgT-=dt;
    if(!doorOpen&&dd<6){
      if(hasKey){doorOpen=true;sfx.creak();banner('扉が開いた！');}
      else if(msgT<=0){banner('鍵がかかっている…キーカードが必要だ');msgT=4;}
    }
    if(doorOpen){door.position.y=Math.min(door.position.y+dt*2,WH*1.6);if(dd<2.5)end(true);}
    // 環境音・心拍・出血演出
    creakT-=dt;if(creakT<0){creakT=10+Math.random()*15;tone('sawtooth',70+Math.random()*60,40,1.5,.06);}
    hbT-=dt;if((p.hp<35||alarm.on)&&hbT<0){hbT=p.hp<35?0.9:0.7;sfx.heart();}
    dmgA=Math.max(0,dmgA-dt*1.5);$('dmg').style.opacity=Math.max(dmgA,p.hp<35?0.35+Math.sin(clockT*6)*0.1:0);
  }
  renderer.render(scene,cam);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
